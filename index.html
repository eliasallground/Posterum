<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Posterum</title>
<style>
:root{--blk:#0f0f0f;--wht:#f5f5f0;--crm:#ede8df;--gld:#c8a96e;--gld2:#a8893e;--red:#c0392b;--gry:#888;--bdr:#ddd8ce;--crd:#ffffff;--rad:12px;--fn:'Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--crm);color:var(--blk);min-height:100vh}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
#sa{background:var(--blk);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
#sa.active{display:flex}
.lw{text-align:center;margin-bottom:48px}
.lm{width:72px;height:72px;background:var(--gld);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px}
.lt{font-size:32px;font-weight:800;color:var(--wht);letter-spacing:2px;text-transform:uppercase}
.ls{font-size:12px;color:var(--gld);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.ac{background:var(--wht);border-radius:var(--rad);padding:32px 28px;width:100%;max-width:400px}
.atabs{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:28px}
.atab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;color:var(--gry);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.atab.active{color:var(--blk);border-bottom-color:var(--gld)}
.apanel{display:none}
.apanel.active{display:block}
label{display:block;font-size:12px;font-weight:600;color:var(--gry);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--bdr);border-radius:8px;font-size:15px;font-family:var(--fn);background:var(--wht);color:var(--blk);margin-bottom:16px;transition:border-color .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gld)}
textarea{resize:vertical;min-height:80px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;letter-spacing:.5px}
.bp{background:var(--gld);color:var(--blk)}
.bp:hover{background:var(--gld2)}
.bs{background:var(--blk);color:var(--wht)}
.bs:hover{background:#333}
.bg{background:transparent;color:var(--gry);border:1.5px solid var(--bdr)}
.bg:hover{border-color:var(--blk);color:var(--blk)}
.bsm{padding:8px 16px;font-size:13px;width:auto;display:inline-block}
.msg{font-size:13px;text-align:center;margin-top:12px;min-height:18px}
.err{color:var(--red)}
.ok{color:#27ae60}
#sap{background:var(--crm)}
#sap.active{display:flex;flex-direction:column}
.tb{background:var(--blk);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tbl{font-size:20px;font-weight:800;color:var(--wht);letter-spacing:2px}
.tbl span{color:var(--gld)}
.tbr{display:flex;align-items:center;gap:12px}
.pb{background:var(--gld);color:var(--blk);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.tav{width:32px;height:32px;border-radius:50%;background:var(--gld);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--blk);cursor:pointer}
.mc{flex:1;padding-bottom:80px}
.bn{position:fixed;bottom:0;left:0;right:0;background:var(--blk);display:flex;height:64px;z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#666;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;gap:4px;transition:color .2s}
.ni.active{color:var(--gld)}
.ni svg{width:22px;height:22px}
.view{display:none;padding:20px}
.view.active{display:block}
.fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ft{font-size:22px;font-weight:800}
.flt{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.fc{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:1.5px solid var(--bdr);background:var(--wht);color:var(--gry);transition:all .2s}
.fc.active{background:var(--blk);color:var(--wht);border-color:var(--blk)}
.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lc{background:var(--crd);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lc:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.li{width:100%;aspect-ratio:1;background:var(--crm);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.li img{width:100%;height:100%;object-fit:cover}
.lin{padding:10px 12px 12px}
.ltt{font-size:13px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm2{font-size:11px;color:var(--gry);margin-bottom:6px}
.lp{font-size:15px;font-weight:800;color:var(--gld2)}
.lp span{font-size:11px;font-weight:600;color:var(--gry)}
.cb{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;margin-left:4px}
.cn{background:#e8f5e9;color:#2e7d32}
.cl{background:#e3f2fd;color:#1565c0}
.cg{background:#fff8e1;color:#f57f17}
.cw{background:#fce4ec;color:#b71c1c}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.md{background:var(--wht);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:24px 24px 40px;position:relative}
.mh{width:40px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 20px}
.mimg{width:100%;aspect-ratio:1;background:var(--crm);border-radius:var(--rad);display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:20px;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:cover}
.mt{font-size:22px;font-weight:800;margin-bottom:4px}
.ms{font-size:13px;color:var(--gry);margin-bottom:12px}
.mp{font-size:28px;font-weight:800;color:var(--gld2);margin-bottom:8px}
.mtgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{background:var(--crm);border:1px solid var(--bdr);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;color:var(--gry)}
.mds{font-size:14px;line-height:1.6;color:#444;margin-bottom:24px}
.mcl{position:absolute;top:16px;right:20px;font-size:24px;cursor:pointer;color:var(--gry);background:none;border:none}
.stl{font-size:22px;font-weight:800;margin-bottom:20px}
.ub{border:2px dashed var(--bdr);border-radius:var(--rad);padding:32px;text-align:center;cursor:pointer;margin-bottom:20px;transition:border-color .2s}
.ub:hover{border-color:var(--gld)}
.ui{font-size:36px;margin-bottom:8px}
.ub p{font-size:13px;color:var(--gry)}
.ip{width:100%;border-radius:var(--rad);margin-bottom:20px;max-height:240px;object-fit:cover}
.fr{display:flex;gap:12px}
.fr>div{flex:1}
.ph{background:var(--blk);border-radius:var(--rad);padding:28px 20px;text-align:center;margin-bottom:20px;color:var(--wht)}
.pav{width:72px;height:72px;border-radius:50%;background:var(--gld);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--blk);margin:0 auto 12px;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover}
.pn{font-size:20px;font-weight:800}
.phd{font-size:13px;color:var(--gld);margin-bottom:4px}
.pg{font-size:12px;color:#888}
.pd{background:var(--gld);color:var(--blk);border-radius:8px;padding:16px;text-align:center;margin:16px 0 20px}
.pd .pn2{font-size:36px;font-weight:800}
.pd .pl{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.sl{font-size:11px;font-weight:700;color:var(--gry);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.mlr{background:var(--wht);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mlt{width:48px;height:48px;border-radius:8px;background:var(--crm);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.mlt img{width:100%;height:100%;object-fit:cover}
.mli{flex:1}
.mlti{font-size:14px;font-weight:700}
.mlp{font-size:12px;color:var(--gld2);font-weight:600}
.sp{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.sav{background:#e8f5e9;color:#2e7d32}
.ssd{background:#fce4ec;color:#b71c1c}
.tr{background:var(--wht);border-radius:10px;padding:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.trt{font-size:14px;font-weight:700;margin-bottom:2px}
.trm{font-size:12px;color:var(--gry)}
.tra{font-size:15px;font-weight:800}
.cr{color:#27ae60}
.dr{color:var(--red)}
.es{text-align:center;padding:48px 20px;color:var(--gry)}
.es .ei{font-size:48px;margin-bottom:12px}
.es p{font-size:14px}
.ld{text-align:center;padding:40px;color:var(--gry);font-size:14px}
.ab{background:var(--blk);color:var(--gld);font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:1px;margin-left:8px}
.adc{background:var(--wht);border-radius:var(--rad);padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.aur{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)}
.aur:last-child{border-bottom:none}
.tbar{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:20px}
.tbt{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gry);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tbt.active{color:var(--blk);border-bottom-color:var(--gld)}
.cfb{background:#fff8e1;border:1.5px solid #f0c040;border-radius:10px;padding:16px;margin-bottom:16px;font-size:14px}
</style>
</head>
<body>

<div id="sa" class="screen active">
  <div class="lw">
    <div class="lm">🥋</div>
    <div class="lt">Posterum</div>
    <div class="ls">The Martial Arts Marketplace</div>
  </div>
  <div class="ac">
    <div class="atabs">
      <div class="atab active" onclick="switchTab('login')">Sign In</div>
      <div class="atab" onclick="switchTab('register')">Join</div>
    </div>
    <div id="ap-login" class="apanel active">
      <label>Username</label>
      <input type="text" id="lu" placeholder="your username" autocomplete="off"/>
      <label>PIN</label>
      <input type="password" id="lp" placeholder="4-digit PIN" maxlength="4"/>
      <button class="btn bp" onclick="doLogin()">Sign In</button>
      <div id="lm" class="msg"></div>
    </div>
    <div id="ap-register" class="apanel">
      <label>Full Name</label>
      <input type="text" id="rn" placeholder="First Last"/>
      <label>Username</label>
      <input type="text" id="ru" placeholder="lowercase, no spaces" autocomplete="off"/>
      <label>Martial Art</label>
      <select id="ra">
        <option value="">Select your art</option>
        <option>Brazilian Jiu-Jitsu</option><option>Judo</option><option>Karate</option>
        <option>Taekwondo</option><option>Wrestling</option><option>Muay Thai</option>
        <option>MMA</option><option>Kung Fu</option><option>Other</option>
      </select>
      <label>Gym / Academy</label>
      <input type="text" id="rg" placeholder="e.g. ALLGROUND Jiu Jitsu"/>
      <label>4-Digit PIN</label>
      <input type="password" id="rpi" placeholder="choose a PIN" maxlength="4"/>
      <button class="btn bp" onclick="doRegister()">Create Account</button>
      <div id="rm" class="msg"></div>
    </div>
  </div>
</div>

<div id="sap" class="screen">
  <div class="tb">
    <div class="tbl">POST<span>ERUM</span></div>
    <div class="tbr">
      <div class="pb" id="tpts">500 PP</div>
      <div class="tav" id="tav" onclick="showView('profile')">?</div>
    </div>
  </div>
  <div class="mc">
    <div id="v-browse" class="view active">
      <div class="fh"><div class="ft">Browse 🥋</div></div>
      <div class="flt" id="fbar">
        <div class="fc active" onclick="setFilter('all',this)">All</div>
        <div class="fc" onclick="setFilter('Gi',this)">Gi</div>
        <div class="fc" onclick="setFilter('No-Gi',this)">No-Gi</div>
        <div class="fc" onclick="setFilter('Rashguard',this)">Rashguard</div>
        <div class="fc" onclick="setFilter('Shorts',this)">Shorts</div>
        <div class="fc" onclick="setFilter('Accessories',this)">Accessories</div>
      </div>
      <div id="lgrid" class="lg"><div class="ld">Loading listings...</div></div>
    </div>

    <div id="v-sell" class="view">
      <div class="stl">List an Item</div>
      <div class="ub" onclick="document.getElementById('imgup').click()">
        <div class="ui">📸</div>
        <p>Tap to add a photo</p>
        <input type="file" id="imgup" accept="image/*" style="display:none" onchange="prevImg(this)"/>
      </div>
      <img id="imgprev" class="ip" style="display:none"/>
      <label>Title</label>
      <input type="text" id="stit" placeholder="e.g. Shoyoroll Batch #32 Gi"/>
      <label>Category</label>
      <select id="scat">
        <option value="">Select category</option>
        <option>Gi</option><option>No-Gi</option><option>Rashguard</option>
        <option>Shorts</option><option>Accessories</option>
      </select>
      <div class="fr">
        <div>
          <label>Size</label>
          <select id="ssz">
            <option value="">Size</option>
            <option>A0</option><option>A1</option><option>A2</option><option>A3</option>
            <option>A4</option><option>A5</option><option>S</option><option>M</option>
            <option>L</option><option>XL</option><option>XXL</option>
            <option>Kids</option><option>One Size</option>
          </select>
        </div>
        <div>
          <label>Condition</label>
          <select id="scnd">
            <option value="">Condition</option>
            <option>New</option><option>Like New</option>
            <option>Good</option><option>Well Worn</option>
          </select>
        </div>
      </div>
      <label>Price (Posterum Points)</label>
      <input type="number" id="sprc" placeholder="e.g. 150" min="1"/>
      <label>Description</label>
      <textarea id="sdsc" placeholder="Brand, color, any flaws, how many washes..."></textarea>
      <button class="btn bp" onclick="doList()">Post Listing</button>
      <div id="sm" class="msg"></div>
    </div>

    <div id="v-profile" class="view">
      <div id="pcon"></div>
    </div>

    <div id="v-admin" class="view">
      <div class="stl">Admin Panel</div>
      <div class="tbar">
        <div class="tbt active" onclick="adminTab('users',this)">Users</div>
        <div class="tbt" onclick="adminTab('listings',this)">Listings</div>
        <div class="tbt" onclick="adminTab('txs',this)">Transactions</div>
      </div>
      <div id="acon"><div class="ld">Loading...</div></div>
    </div>
  </div>

  <nav class="bn">
    <div class="ni active" id="n-browse" onclick="showView('browse')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Browse
    </div>
    <div class="ni" id="n-sell" onclick="showView('sell')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Sell
    </div>
    <div class="ni" id="n-profile" onclick="showView('profile')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </div>
    <div class="ni" id="n-admin" onclick="showView('admin')" style="display:none">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Admin
    </div>
  </nav>
</div>

<div id="mover" class="mo" onclick="closeMo(event)">
  <div class="md" id="mcon">
    <div class="mh"></div>
    <button class="mcl" onclick="closeMo()">✕</button>
    <div id="mbody"></div>
  </div>
</div>

<script>
const SB='https://qmjldudabxwnrbwzokbw.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtamxkdWRhYnh3bnJid3pva2J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTMwMjQsImV4cCI6MjA5MzU4OTAyNH0.GJ-yCYSjwwv0L9-gHhOOgVpCugMCAEdeU4KTKO4ELoc';
const ADMINS=['elias','laird'];
let CU=null,listings=[],curFilter='all',imgB64=null,curAdminTab='users';

async function db(table,method='GET',body=null,qs=''){
  const r=await fetch(`${SB}/rest/v1/${table}${qs}`,{
    method,
    headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''},
    body:body?JSON.stringify(body):null
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||r.statusText)}
  return r.status===204?null:r.json();
}

function switchTab(t){
  document.querySelectorAll('.atab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.apanel').forEach(x=>x.classList.remove('active'));
  document.querySelector(`.atab:${t==='login'?'first-child':'last-child'}`).classList.add('active');
  document.getElementById('ap-'+t).classList.add('active');
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim().toLowerCase();
  const p=document.getElementById('lp').value.trim();
  const m=document.getElementById('lm');
  if(!u||!p){m.textContent='Enter username and PIN';m.className='msg err';return}
  m.textContent='Signing in...';m.className='msg';
  try{
    const r=await db('users','GET',null,`?username=eq.${u}&pin=eq.${p}`);
    if(!r.length){m.textContent='Invalid username or PIN';m.className='msg err';return}
    CU=r[0];enterApp();
  }catch(e){m.textContent=e.message;m.className='msg err'}
}

async function doRegister(){
  const n=document.getElementById('rn').value.trim();
  const u=document.getElementById('ru').value.trim().toLowerCase().replace(/\s+/g,'');
  const a=document.getElementById('ra').value;
  const g=document.getElementById('rg').value.trim();
  const p=document.getElementById('rpi').value.trim();
  const m=document.getElementById('rm');
  if(!n||!u||!p){m.textContent='Name, username and PIN required';m.className='msg err';return}
  if(p.length!==4||!/^\d+$/.test(p)){m.textContent='PIN must be 4 digits';m.className='msg err';return}
  m.textContent='Creating account...';m.className='msg';
  try{
    const r=await db('users','POST',{name:n,username:u,pin:p,martial_art:a,gym:g,points:500});
    CU=r[0];enterApp();
  }catch(e){
    m.textContent=e.message.includes('unique')?'Username already taken':e.message;
    m.className='msg err';
  }
}

function enterApp(){
  document.getElementById('sa').classList.remove('active');
  document.getElementById('sap').classList.add('active');
  updateBar();
  if(ADMINS.includes(CU.username))document.getElementById('n-admin').style.display='flex';
  loadListings();
}

function updateBar(){
  document.getElementById('tpts').textContent=CU.points+' PP';
  document.getElementById('tav').textContent=CU.name.charAt(0).toUpperCase();
}

function showView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(x=>x.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  const n=document.getElementById('n-'+v);
  if(n)n.classList.add('active');
  if(v==='profile')renderProfile();
  if(v==='admin')renderAdmin();
}

async function loadListings(){
  try{
    const d=await db('listings','GET',null,'?order=created_at.desc&status=eq.available');
    const ids=[...new Set(d.map(l=>l.seller_id))];
    let smap={};
    if(ids.length){
      const su=await db('users','GET',null,`?id=in.(${ids.join(',')})`);
      su.forEach(u=>smap[u.id]=u);
    }
    listings=d.map(l=>({...l,seller:smap[l.seller_id]}));
    renderListings();
  }catch(e){document.getElementById('lgrid').innerHTML=`<div class="ld">Error: ${e.message}</div>`}
}

function setFilter(f,el){
  curFilter=f;
  document.querySelectorAll('.fc').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderListings();
}

function cond(c){return{New:'cn','Like New':'cl',Good:'cg','Well Worn':'cw'}[c]||'cg'}
function emoji(c){return{Gi:'🥋','No-Gi':'👕',Rashguard:'🦺',Shorts:'🩳',Accessories:'🎽'}[c]||'🥋'}

function renderListings(){
  const g=document.getElementById('lgrid');
  const f=curFilter==='all'?listings:listings.filter(l=>l.category===curFilter);
  if(!f.length){g.innerHTML=`<div class="es" style="grid-column:1/-1"><div class="ei">🥋</div><p>No listings yet. Be first to sell!</p></div>`;return}
  g.innerHTML=f.map(l=>`
    <div class="lc" onclick="openL('${l.id}')">
      <div class="li">${l.image_url?`<img src="${l.image_url}" alt="${l.title}"/>`:emoji(l.category)}</div>
      <div class="lin">
        <div class="ltt">${l.title}</div>
        <div class="lm2">${l.size||''} ${l.condition?`<span class="cb ${cond(l.condition)}">${l.condition}</span>`:''}</div>
        <div class="lp">${l.price} <span>PP</span></div>
      </div>
    </div>`).join('');
}

function openL(id){
  const l=listings.find(x=>x.id===id);
  if(!l)return;
  const mine=l.seller_id===CU.id;
  const afford=CU.points>=l.price;
  document.getElementById('mbody').innerHTML=`
    <div class="mimg">${l.image_url?`<img src="${l.image_url}"/>`:`<span style="font-size:80px">${emoji(l.category)}</span>`}</div>
    <div class="mt">${l.title}</div>
    <div class="ms">Listed by @${l.seller?.username||'?'} · ${l.seller?.gym||''}</div>
    <div class="mp">${l.price} PP</div>
    <div class="mtgs">
      ${l.category?`<span class="tag">${l.category}</span>`:''}
      ${l.size?`<span class="tag">${l.size}</span>`:''}
      ${l.condition?`<span class="tag cb ${cond(l.condition)}">${l.condition}</span>`:''}
    </div>
    ${l.description?`<div class="mds">${l.description}</div>`:''}
    <div id="mam" class="msg" style="margin-bottom:12px"></div>
    ${mine
      ?`<button class="btn bg" onclick="delL('${l.id}')">Remove My Listing</button>`
      :afford
        ?`<button class="btn bp" onclick="doBuy('${l.id}')">Buy for ${l.price} PP</button>`
        :`<div class="cfb">You need ${l.price-CU.points} more PP to buy this.</div>`
    }`;
  document.getElementById('mover').classList.add('open');
}

function closeMo(e){
  if(!e||e.target===document.getElementById('mover'))
    document.getElementById('mover').classList.remove('open');
}

async function doBuy(lid){
  const l=listings.find(x=>x.id===lid);
  if(!l)return;
  const m=document.getElementById('mam');
  m.textContent='Processing...';m.className='msg';
  try{
    await db('users','PATCH',{points:CU.points-l.price},`?id=eq.${CU.id}`);
    const [seller]=await db('users','GET',null,`?id=eq.${l.seller_id}`);
    await db('users','PATCH',{points:seller.points+l.price},`?id=eq.${l.seller_id}`);
    await db('listings','PATCH',{status:'sold'},`?id=eq.${lid}`);
    await db('transactions','POST',{listing_id:lid,buyer_id:CU.id,seller_id:l.seller_id,amount:l.price});
    CU.points-=l.price;
    updateBar();
    listings=listings.filter(x=>x.id!==lid);
    renderListings();
    m.textContent=`✅ Purchased! Coordinate pickup with @${seller.username}.`;
    m.className='msg ok';
    document.querySelector('#mbody button')?.remove();
  }catch(e){m.textContent=e.message;m.className='msg err'}
}

async function delL(id){
  if(!confirm('Remove this listing?'))return;
  try{
    await db('listings','PATCH',{status:'removed'},`?id=eq.${id}`);
    listings=listings.filter(x=>x.id!==id);
    renderListings();
    document.getElementById('mover').classList.remove('open');
  }catch(e){alert(e.message)}
}

function prevImg(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{imgB64=e.target.result;const p=document.getElementById('imgprev');p.src=imgB64;p.style.display='block'};
  r.readAsDataURL(f);
}

async function doList(){
  const t=document.getElementById('stit').value.trim();
  const c=document.getElementById('scat').value;
  const sz=document.getElementById('ssz').value;
  const cn=document.getElementById('scnd').value;
  const pr=parseInt(document.getElementById('sprc').value);
  const ds=document.getElementById('sdsc').value.trim();
  const m=document.getElementById('sm');
  if(!t||!pr){m.textContent='Title and price required';m.className='msg err';return}
  m.textContent='Posting...';m.className='msg';
  try{
    const pay={seller_id:CU.id,title:t,category:c,size:sz,condition:cn,price:pr,description:ds,status:'available'};
    if(imgB64)pay.image_url=imgB64;
    const [nl]=await db('listings','POST',pay);
    listings.unshift({...nl,seller:CU});
    renderListings();
    ['stit','sprc','sdsc'].forEach(id=>document.getElementById(id).value='');
    ['scat','ssz','scnd'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('imgprev').style.display='none';
    imgB64=null;
    m.textContent='✅ Listing posted!';m.className='msg ok';
    setTimeout(()=>{m.textContent='';showView('browse')},1500);
  }catch(e){m.textContent=e.message;m.className='msg err'}
}

async function renderProfile(){
  const el=document.getElementById('pcon');
  el.innerHTML='<div class="ld">Loading...</div>';
  try{
    const [u]=await db('users','GET',null,`?id=eq.${CU.id}`);
    CU=u;updateBar();
    const ml=await db('listings','GET',null,`?seller_id=eq.${CU.id}&order=created_at.desc`);
    const tx=await db('transactions','GET',null,`?or=(buyer_id.eq.${CU.id},seller_id.eq.${CU.id})&order=created_at.desc`);
    const isA=ADMINS.includes(CU.username);
    el.innerHTML=`
      <div class="ph">
        <div class="pav">${CU.name.charAt(0)}</div>
        <div class="pn">${CU.name}${isA?'<span class="ab">Admin</span>':''}</div>
        <div class="phd">@${CU.username}</div>
        <div class="pg">${CU.martial_art||''} ${CU.gym?'· '+CU.gym:''}</div>
      </div>
      <div class="pd"><div class="pn2">${CU.points}</div><div class="pl">Posterum Points</div></div>
      <div class="sl">My Listings (${ml.length})</div>
      ${ml.length?ml.map(l=>`
        <div class="mlr">
          <div class="mlt">${l.image_url?`<img src="${l.image_url}"/>`:emoji(l.category)}</div>
          <div class="mli"><div class="mlti">${l.title}</div><div class="mlp">${l.price} PP</div></div>
          <div class="sp ${l.status==='available'?'sav':'ssd'}">${l.status}</div>
        </div>`).join(''):'<div class="es"><p>No listings yet</p></div>'}
      <br/><div class="sl">Transaction History</div>
      ${tx.length?tx.map(t=>{
        const iB=t.buyer_id===CU.id;
        return`<div class="tr"><div style="display:flex;justify-content:space-between;align-items:center">
          <div><div class="trt">${iB?'Purchased item':'Sold item'}</div><div class="trm">${new Date(t.created_at).toLocaleDateString()}</div></div>
          <div class="tra ${iB?'dr':'cr'}">${iB?'-':'+'}${t.amount} PP</div>
        </div></div>`;
      }).join(''):'<div class="es"><p>No transactions yet</p></div>'}
      <br/><button class="btn bg" onclick="doLogout()">Sign Out</button>`;
  }catch(e){el.innerHTML=`<div class="ld">Error: ${e.message}</div>`}
}

function doLogout(){
  CU=null;listings=[];
  document.getElementById('sap').classList.remove('active');
  document.getElementById('sa').classList.add('active');
  document.getElementById('n-admin').style.display='none';
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
  document.getElementById('lm').textContent='';
  showView('browse');
}

function adminTab(t,el){
  curAdminTab=t;
  document.querySelectorAll('.tbt').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  renderAdmin();
}

async function renderAdmin(){
  if(!ADMINS.includes(CU?.username))return;
  const el=document.getElementById('acon');
  el.innerHTML='<div class="ld">Loading...</div>';
  try{
    if(curAdminTab==='users'){
      const us=await db('users','GET',null,'?order=created_at.desc');
      el.innerHTML=`<div class="adc">
        <div style="font-size:13px;color:var(--gry);margin-bottom:12px">${us.length} members</div>
        ${us.map(u=>`<div class="aur">
          <div><strong>${u.name}</strong> <span style="color:var(--gry);font-size:12px">@${u.username}</span><br/>
          <span style="font-size:12px;color:var(--gry)">${u.martial_art||''} ${u.gym?'· '+u.gym:''}</span></div>
          <div style="display:flex;align-items:center;gap:8px">
            <strong style="color:var(--gld2)">${u.points} PP</strong>
            <button class="btn bp bsm" onclick="addPP('${u.id}',${u.points})">+ PP</button>
          </div>
        </div>`).join('')}
      </div>`;
    }else if(curAdminTab==='listings'){
      const ls=await db('listings','GET',null,'?order=created_at.desc');
      el.innerHTML=ls.length?ls.map(l=>`
        <div class="adc" style="padding:14px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div><strong>${l.title}</strong><br/><span style="font-size:12px;color:var(--gry)">${l.category||''} · ${l.size||''} · ${l.condition||''}</span></div>
            <div style="text-align:right"><div style="font-weight:700;color:var(--gld2)">${l.price} PP</div>
            <div class="sp ${l.status==='available'?'sav':'ssd'}" style="display:inline-block;margin-top:4px">${l.status}</div></div>
          </div>
          ${l.status==='available'?`<button class="btn bg bsm" style="margin-top:10px" onclick="adminDel('${l.id}')">Remove</button>`:''}
        </div>`).join(''):'<div class="es"><p>No listings</p></div>';
    }else{
      const txs=await db('transactions','GET',null,'?order=created_at.desc');
      const uids=[...new Set([...txs.map(t=>t.buyer_id),...txs.map(t=>t.seller_id)])];
      let um={};
      if(uids.length){const us=await db('users','GET',null,`?id=in.(${uids.join(',')})`);us.forEach(u=>um[u.id]=u)}
      el.innerHTML=txs.length?txs.map(t=>`
        <div class="tr"><div style="display:flex;justify-content:space-between;align-items:center">
          <div><div class="trt">@${um[t.buyer_id]?.username||'?'} → @${um[t.seller_id]?.username||'?'}</div>
          <div class="trm">${new Date(t.created_at).toLocaleDateString()}</div></div>
          <div class="tra cr">${t.amount} PP</div>
        </div></div>`).join(''):'<div class="es"><p>No transactions yet</p></div>';
    }
  }catch(e){el.innerHTML=`<div class="ld">Error: ${e.message}</div>`}
}

async function addPP(uid,cur){
  const a=prompt('How many Posterum Points to add?','100');
  if(!a||isNaN(parseInt(a)))return;
  const add=parseInt(a);
  try{
    await db('users','PATCH',{points:cur+add},`?id=eq.${uid}`);
    if(uid===CU.id){CU.points+=add;updateBar()}
    renderAdmin();
  }catch(e){alert(e.message)}
}

async function adminDel(id){
  if(!confirm('Remove this listing?'))return;
  try{await db('listings','PATCH',{status:'removed'},`?id=eq.${id}`);renderAdmin()}
  catch(e){alert(e.message)}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('ap-login').classList.contains('active'))doLogin();
});
</script>
</body>
</html>
